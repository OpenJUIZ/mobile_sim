# mobile_sim の起動設定
#   開発中: scripts/dev_plugin.sh でプラグインを app/plugins/<target>/ に置いてから
#           juiz -f app/app.conf -d
#   パッケージ: juiz run mobile_sim-<version>.juizapp
"name": "mobile_sim"
"option":
  "http_broker":
    "start": true
    "port": 8000
    # ブラウザ画面(conf のディレクトリからの相対)
    "static_filepaths":
      "/": "web"
"plugins":
  "components":
    "mobile_sim":
      "language": "rust"
      "path": "plugins/{target}"
"containers":
  # Transformations の Anchor(座標系の原点)。world は真の座標系(地図画像と同じ)、odom0 はロボット 0 のオドメトリの原点
  - { "type_name": "static_anchor", "name": "world" }
  - { "type_name": "static_anchor", "name": "odom0" }
  - "type_name": "mobile_sim"
    "name": "sim0"
    # mapconf のパス。相対パスは JUIZ_APP_DIR(juiz run の展開先)、無ければカレントディレクトリから。
    # 環境変数 MOBILE_SIM_MAP があればそちらを使う
    "map": "assets/maps/default.yaml"
    "seed": 0
    "step":
      "mode": "real_time"
      "max_dt": 0.1
    # ロボットは下の mobile_robot で足す
    "robots": []
    "processes":
      - "type_name": "mobile_sim_step"
        "name": "step0"
        "use_memo": false
      # 以下の index つきの Process は 0.3 系では残す(0.4 で消す)
      - "type_name": "mobile_sim_set_velocity"
        "name": "set_velocity0"
        "use_memo": false
      - "type_name": "mobile_sim_get_pose"
        "name": "get_pose0"
        "use_memo": false
      - "type_name": "mobile_sim_get_odometry"
        "name": "get_odometry0"
        "use_memo": false
      - "type_name": "mobile_sim_get_odom_pose"
        "name": "get_odom_pose0"
        "use_memo": false
      - "type_name": "mobile_sim_get_scan"
        "name": "get_scan0"
        "use_memo": false
      - "type_name": "mobile_sim_get_map"
        "name": "get_map0"
      - "type_name": "mobile_sim_get_map_info"
        "name": "get_map_info0"
        "use_memo": false
      - "type_name": "mobile_sim_load_map"
        "name": "load_map0"
        "use_memo": false
      - "type_name": "mobile_sim_reset_pose"
        "name": "reset_pose0"
        "use_memo": false
      - "type_name": "mobile_sim_get_state"
        "name": "get_state0"
        "use_memo": false
  # ロボット 0。真の位置を world から、オドメトリを odom0 から見た ContainerPose として書く
  - "type_name": "mobile_robot"
    "name": "robot0"
    "sim": "sim0"
    "world": "world"
    "odom": "odom0"
    "drive": "diff_drive"
    "radius": 0.2
    "max_velocity": { "vx": 1.0, "vy": 0.0, "omega": 1.5 }
    "max_acceleration": { "vx": 1.0, "vy": 0.0, "omega": 3.0 }
    "command_timeout": 0.5
    "initial_pose": { "x": -2.0, "y": 0.0, "theta": 0.0 }
    # 車輪オドメトリの誤差(1 m・1 rad あたりの標準偏差)。書かなければ誤差無し
    "odometry": { "linear_noise": 0.02, "angular_noise": 0.03, "drift_noise": 0.02 }
    "processes":
      # main_ec で呼ばれるたびに位置を書き、オドメトリ(Pose2DStamped、frame odom0)をトピック odom に出す
      - "type_name": "mobile_robot_update"
        "name": "update0"
        "use_memo": false
        "publishes":
          - "odom"
      - "type_name": "mobile_robot_set_velocity"
        "name": "robot_set_velocity0"
        "use_memo": false
        "subscribes":
          "velocity": "cmd_vel"
      - "type_name": "mobile_robot_reset_pose"
        "name": "robot_reset_pose0"
        "use_memo": false
  # ロボット 0 の LiDAR。取付位置は下の transforms の robot0 -> lidar0 だけに書く
  - "type_name": "mobile_lidar"
    "name": "lidar0"
    "sim": "sim0"
    "base": "robot0"
    "angle_min": -2.35
    "angle_max": 2.35
    "num_beams": 271
    "range_max": 8.0
    "processes":
      # main_ec で呼ばれるたびに LaserScan(frame lidar0)をトピック scan に出す
      - "type_name": "mobile_lidar_scan"
        "name": "scan0"
        "use_memo": false
        "publishes":
          - "scan"
      # robot0 から見た取付位置(PoseStamped)をトピック lidar_mount に出す(別の System の mapper 用)
      - "type_name": "mobile_lidar_mount"
        "name": "mount0"
        "use_memo": false
        "publishes":
          - "lidar_mount"
# 座標系の木: world -> robot0 -> lidar0 と odom0 -> robot0。
# world -> robot0 と odom0 -> robot0 の値は robot0 の update が書く
"transforms":
  - { "source": "world", "destination": "robot0" }
  - { "source": "odom0", "destination": "robot0" }
  - "source": "robot0"
    "destination": "lidar0"
    "translation": { "x": 0.0, "y": 0.0, "z": 0.2 }
"ecs":
  # main_loop_ec は 1 つのシステムに 1 つだけ(juiz の spin を使うため)。
  # 1 周で「進める → 位置を書いてオドメトリを出す → スキャンを出す → 取付位置を出す」の順に呼び、odom と scan を同じ時刻にそろえる
  - "type_name": "main_loop_ec"
    "name": "main_ec"
    "rate": 20
    "bind":
      - "type_name": "mobile_sim_step"
        "name": "step0"
        "container_name": "sim0"
      - "type_name": "mobile_robot_update"
        "name": "update0"
        "container_name": "robot0"
      - "type_name": "mobile_lidar_scan"
        "name": "scan0"
        "container_name": "lidar0"
      - "type_name": "mobile_lidar_mount"
        "name": "mount0"
        "container_name": "lidar0"
    "auto_start": true
