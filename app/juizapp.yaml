# .juizapp のマニフェスト(juiz docs/spec/app-package.md §4)。languages・targets・rust・files は juiz pack が書き足す
format: 1
name: mobile_sim
version: 0.3.3
kind: base
description: "Planar mobile robot simulator with map, collision, LiDAR and a browser view"
license: MIT OR Apache-2.0
homepage: https://github.com/OpenJUIZ/mobile_sim
# C ABI の Rust プラグインなので、その ABI を読める juiz(0.2.4 以降。Transformations・System をまたぐ Transform・readonly の ContainerProcess を使う)なら rustc は問わない
juiz: ">=0.2.4"
entry: app.conf
base:
  http_port: 8000
