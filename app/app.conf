# mobile_sim の起動設定
#   開発中: scripts/dev_plugin.sh でプラグインを app/plugins/<target>/ に置いてから
#           juiz -f app/app.conf -d
#   パッケージ: juiz run mobile_sim-<version>.juizapp
"name": "mobile_sim"
"option":
  "http_broker":
    "start": true
    "port": 8000
    # ブラウザ画面。juiz 0.0.30 からは conf のディレクトリからの相対、0.0.29 まではカレントディレクトリからの相対
    # (0.0.29 では app/ に cd してから起動する)
    "static_filepaths":
      "/": "web"
"plugins":
  "components":
    "mobile_sim":
      "language": "rust"
      "path": "plugins/{target}"
"containers":
  - "type_name": "mobile_sim"
    "name": "sim0"
    # mapconf のパス。相対パスは JUIZ_APP_DIR(juiz run の展開先)、無ければカレントディレクトリから。
    # 環境変数 MOBILE_SIM_MAP があればそちらを使う
    "map": "assets/maps/default.yaml"
    "seed": 0
    "step":
      "mode": "real_time"
      "max_dt": 0.1
    "robots":
      - "drive": "diff_drive"
        "radius": 0.2
        "max_velocity": { "vx": 1.0, "vy": 0.0, "omega": 1.5 }
        "max_acceleration": { "vx": 1.0, "vy": 0.0, "omega": 3.0 }
        "command_timeout": 0.5
        "initial_pose": { "x": -2.0, "y": 0.0, "theta": 0.0 }
        "lidar": { "angle_min": -2.35, "angle_max": 2.35, "num_beams": 271, "range_max": 8.0 }
    "processes":
      - "type_name": "mobile_sim_step"
        "name": "step0"
        "use_memo": false
      - "type_name": "mobile_sim_set_velocity"
        "name": "set_velocity0"
        "use_memo": false
        "subscribe":
          "velocity": "cmd_vel"
      - "type_name": "mobile_sim_get_pose"
        "name": "get_pose0"
        "use_memo": false
      - "type_name": "mobile_sim_get_odometry"
        "name": "get_odometry0"
        "use_memo": false
      - "type_name": "mobile_sim_get_scan"
        "name": "get_scan0"
        "use_memo": false
      - "type_name": "mobile_sim_get_map"
        "name": "get_map0"
      - "type_name": "mobile_sim_get_map_info"
        "name": "get_map_info0"
        "use_memo": false
      - "type_name": "mobile_sim_load_map"
        "name": "load_map0"
        "use_memo": false
      - "type_name": "mobile_sim_reset_pose"
        "name": "reset_pose0"
        "use_memo": false
      - "type_name": "mobile_sim_get_state"
        "name": "get_state0"
        "use_memo": false
"ecs":
  - "type_name": "main_loop_ec"
    "name": "main_ec"
    "rate": 50
    "bind":
      - "type_name": "mobile_sim_step"
        "name": "step0"
        "container_name": "sim0"
    "auto_start": true
